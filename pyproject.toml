[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniscan"
version = "0.1.0"
description = "OCR pipeline for building searchable PDF with Surya/Chandra/hybrid modes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "img_2_pdf contributors" }
]
dependencies = [
  "opencv-python>=4.8",
  "numpy>=1.26",
  "pillow>=10.2",
  "img2pdf>=0.5",
  "pymupdf>=1.24"
]

[project.optional-dependencies]
ocr = [
  "ocrmypdf>=16.0",
  "pypdf>=4.0",
  "reportlab>=4.0"
]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "types-reportlab"
]

[project.scripts]
uniscan = "uniscan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.mypy.overrides]]
# Optional OCR backends and img2pdf do not publish typed interfaces.
module = [
  "chandra",
  "chandra.*",
  "img2pdf",
  "mineru",
  "mineru.*",
  "paddleocr",
  "paddleocr.*",
  "surya",
  "surya.*",
]
ignore_missing_imports = true
