services:
  ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: surya-chandra-ocr:latest
    container_name: surya-chandra-ocr-api
    ports:
      - "127.0.0.1:${UNISCAN_HOST_PORT:-8000}:8000"
    environment:
      UNISCAN_HTTP_PORT: "8000"
      # Deliberately immutable: an environment override must never retarget
      # the container to a foreign adapter before application preflight.
      UNISCAN_GPU_DEVICE_ID: "GPU-e6a8c006-5017-6126-01cc-bf9bd972bf4f"
      CUDA_VISIBLE_DEVICES: "0"
      UNISCAN_DEFAULT_LANG: "rus+eng"
      UNISCAN_WORK_ROOT: "/data/work"
      UNISCAN_CHANDRA_DEVICE_POLICY: "cuda"
      UNISCAN_CHANDRA_REQUIRE_GPU: "1"
      UNISCAN_SURYA_TORCH_DEVICE: "cuda:0"
      UNISCAN_SURYA_REQUIRE_GPU: "1"
      UNISCAN_SURYA_ALLOW_TEXT_FALLBACK: "0"
      UNISCAN_SURYA_REQUIRE_GEOMETRY_JSON: "1"
      UNISCAN_CHANDRA_REQUIRE_SIDECAR: "${UNISCAN_CHANDRA_REQUIRE_SIDECAR:-1}"
      UNISCAN_OCR_RENDER_DPI: "${UNISCAN_OCR_RENDER_DPI:-220}"
      UNISCAN_HYBRID_CHUNK_PAGES: "${UNISCAN_HYBRID_CHUNK_PAGES:-10}"
      UNISCAN_ALIGN_BAND: "${UNISCAN_ALIGN_BAND:-}"
      UNISCAN_TEXTLESS_JPEG_QUALITY: "${UNISCAN_TEXTLESS_JPEG_QUALITY:-85}"
      UNISCAN_ENGINE_SUBPROCESS_TIMEOUT_SECONDS: "${UNISCAN_ENGINE_SUBPROCESS_TIMEOUT_SECONDS:-7200}"
      OCR_WORKER_TIMEOUT_SECONDS: "${OCR_WORKER_TIMEOUT_SECONDS:-1800}"
      OCR_WORKER_WATCHDOG_INTERVAL_SECONDS: "${OCR_WORKER_WATCHDOG_INTERVAL_SECONDS:-30}"
    volumes:
      - ./.hf_cache_chandra:/cache/hf_chandra
      - ./.hf_cache_surya:/cache/hf_surya
      - ./.surya_cache:/cache/surya_models
      - ./.modelscope_cache:/cache/modelscope
      - ./outputs:/data/work
      - ./PDFs:/data/in
    networks:
      default:
      zotero-automation:
        aliases:
          - surya-chandra-ocr-api
          - ocr-api
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["GPU-e6a8c006-5017-6126-01cc-bf9bd972bf4f"]
              capabilities: [gpu]
    restart: "no"

networks:
  zotero-automation:
    external: true
